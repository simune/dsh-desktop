# 跨平台构建目录说明:
# 本文件不再硬编码 target-dir(原值为本机 macOS 路径 /Users/lm/...,
# 在 Windows 上会导致 cargo 尝试创建 D:\Users\lm\Library\Caches\... 并可能失败)。
# 构建产物默认落在 dsh-desktop/src-tauri/target。
#
# 若构建卷存在 AppleDouble 侧车问题(如 ExFAT 卷导致 tauri-build 遍历 panic),
# 可设置 CARGO_TARGET_DIR 指向 APFS/NTFS 卷,例如:
#   macOS:   export CARGO_TARGET_DIR="$HOME/Library/Caches/dsh-desktop/target"
#   Windows: $env:CARGO_TARGET_DIR = "$env:LOCALAPPDATA\dsh-desktop\target"
